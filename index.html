<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>智慧庫存工作台</title><style>
    :root {
      --bg: #eef3f7;
      --panel: #ffffff;
      --soft: #f7fafc;
      --ink: #17212b;
      --muted: #647483;
      --line: #dce5ec;
      --blue: #1769d6;
      --green: #157347;
      --amber: #a86107;
      --red: #b42318;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;

      color: var(--ink);

      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    .desk {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;

    }
    h1 { margin: 0; font-size: 26px; line-height: 1.15; }
    .top small { color: var(--muted); display: block; margin-top: 5px; }

    .btn {
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cfdbe5;

      background: #fff;

      font-weight: 800;
    }
    .btn.primary { border: 0; color: #fff; background: var(--blue); }
    .nav {
      display: inline-grid;

    }

    }
    .nav .active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 3px 10px rgba(22, 35, 49, .08);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr repeat(3, minmax(0, .55fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .hero-card, .kpi {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;

    }
    .hero-card {
      min-height: 146px;
      color: #fff;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: end;

    }
    .hero-card h2 { margin: 0 0 6px; font-size: 23px; }
    .hero-card p { margin: 0; color: rgba(255,255,255,.82); }
    .kpi { padding: 15px; }
    .kpi span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .kpi strong { font-size: 25px; }
    .kpi em { display: block; margin-top: 8px; color: var(--green); font-style: normal; font-size: 12px; font-weight: 800; }
    .work-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }
    .panel {
      background: var(--panel);

      border-radius: 8px;
      box-shadow: var(--shadow);

    }
    .panel-head {
      padding: 13px 14px;

      gap: 8px;

      justify-content: flex-end;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 150px 150px 150px auto auto;

      padding: 12px 14px;
      background: var(--soft);
      border-bottom: 1px solid var(--line);
    }
    input, select {
      height: 40px;
      border: 1px solid #cbd8e2;

    .sync {

      background: #fff;
    }

    }
    .record img {

    }

      color: #3d5060;

      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-bottom {
      display: grid;
      grid-template-columns: minmax(78px, 1fr) auto auto;
      gap: 6px;
      align-items: center;
      padding: 9px 8px 9px 10px;
      border-top: 1px solid var(--line);
      background: #fbfdff;
    }
    .money { font-weight: 900; color: var(--green); font-size: 18px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .chip.green { background: #e8f7ef; color: var(--green); }
    .chip.amber { background: #fff2db; color: var(--amber); }
    .chip.blue { background: #e8f1ff; color: #155bc0; }
    .mini-actions { display: flex; gap: 6px; }
    .icon {
      width: 34px;
      height: 34px;
      border: 1px solid #d5e0e8;
      border-radius: 8px;
      background: #fff;
    }
    .icon.danger { color: var(--red); background: #fff0ef; border-color: #ffd2cf; }
    .pick-panel {
      position: sticky;
      top: 18px;
    }
    .pick-list {
      padding: 12px;
      display: grid;
      gap: 9px;
    }
    .pick-group {
      display: grid;
      gap: 8px;
    }
    .pick-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid #d6e7fb;
      border-radius: 8px;
      background: #f0f7ff;
      color: #234661;
      font-size: 12px;
      font-weight: 900;
    }
    .pick-group-head span {
      color: #526579;
      font-size: 12px;
      white-space: nowrap;
    }
    .fill-collector {
      margin-left: auto;
      height: 24px;
      border: 1px solid #bdd2e8;
      border-radius: 7px;
      background: #fff;
      color: #1769d6;
      font-size: 12px;
      font-weight: 900;
      padding: 0 8px;
      white-space: nowrap;
    }
    .pick-row {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 1px solid #e1e9ef;
      border-radius: 8px;
      background: #fff;
    }
    .pick-row img {
      width: 58px;
      height: 58px;
      border-radius: 8px;
      object-fit: cover;
    }
    .pick-row b {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pick-row span { color: var(--muted); font-size: 12px; }
    .pick-main {
      min-width: 0;
    }
    .pick-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin: 2px 0;
    }
    .pick-qty-control {
      display: inline-grid;
      grid-template-columns: 26px 38px 26px;
      align-items: center;
      overflow: hidden;
      border: 1px solid #d5e0e8;
      border-radius: 8px;
      background: #fff;
      flex: 0 0 auto;
    }
    .pick-qty-control button {
      height: 26px;
      border: 0;
      background: #f3f7fa;
      color: #314557;
      font-weight: 900;
    }
    .pick-qty-control input {
      width: 38px;
      height: 26px;
      border: 0;
      border-left: 1px solid #d5e0e8;
      border-right: 1px solid #d5e0e8;
      border-radius: 0;
      padding: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
    }
    .pick-subtotal {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .remove {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      color: var(--red);
      background: #fff0ef;
      font-weight: 900;
    }
    .total {
      padding: 14px;
      background: var(--soft);
      border-top: 1px solid var(--line);
    }
    .total-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .total-line strong { color: var(--ink); font-size: 25px; }
    .finish {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-weight: 900;
    }
    @media (max-width: 1050px) {
      .hero-grid { grid-template-columns: repeat(2, 1fr); }
      .work-grid { grid-template-columns: 1fr; }
      .pick-panel { position: static; }
    }
    @media (max-width: 760px) {
      .top, .toolbar, .hero-grid { grid-template-columns: 1fr; }
      .records { grid-template-columns: 1fr; }
      .nav { width: 100%; grid-template-columns: repeat(3, 1fr); }
    }
  
.view { display: none; }
.view.active { display: block; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px; }
.form-grid .full { grid-column: 1 / -1; }
textarea.field { height: 88px; padding-top: 10px; resize: vertical; }
.preview { max-height: 260px; width: 100%; object-fit: contain; border-radius: 8px; background: #f1f5f8; border: 1px solid var(--line); display: none; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px); z-index: 8000; background: rgba(23,33,43,.94); color: #fff; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: .2s ease; pointer-events: none; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: rgba(30,143,88,.96); }
.toast.error { background: rgba(180,35,24,.96); }
.record-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
.record-controls select, .table-row select { height: 32px; border: 1px solid #cbd7e1; border-radius: 8px; background: #fff; padding: 0 8px; min-width: 0; font-size: 13px; max-width: 150px; }
.qty-input { width: 50px; height: 34px; border: 1px solid #cbd7e1; border-radius: 8px; padding: 0 8px; }
.mini-actions { display: grid !important; grid-template-columns: 50px 54px 34px 34px; align-items: center; gap: 5px; justify-content: end; }
.add-pick { border: 0; border-radius: 8px; height: 34px; padding: 0 8px; background: var(--blue); color: #fff; font-weight: 800; white-space: nowrap; min-width: 54px; }
.mini-actions .icon { width: 34px; height: 34px; }
.record.is-full { opacity: .62; background: #f5f7fa; }

.record.is-full .money { color: #7a8793; }
.stock-info { display: grid; gap: 2px; min-width: 78px; }
.stock-info .amount { font-weight: 900; color: var(--green); font-size: 18px; line-height: 1.15; }
.stock-info .remain { color: #526579; font-size: 12px; font-weight: 800; }
.record.is-full .stock-info .amount, .record.is-full .stock-info .remain { color: #7a8793; }
.qty-input:disabled { background: #eef2f5; color: #8a98a6; cursor: not-allowed; }
.add-pick:disabled, .icon:disabled { background: #e1e7ed !important; color: #7a8793 !important; cursor: not-allowed; border-color: #d4dde5 !important; }
.chip.full { background: #eef2f6; color: #647483; }
.pick-row div span, .pick-card div span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clear-pick { height: 30px; border: 1px solid #d5e0e8; border-radius: 8px; background: #fff; color: #526579; font-weight: 800; padding: 0 10px; white-space: nowrap; }
.clear-pick:disabled { background: #eef2f5; color: #99a6b2; cursor: not-allowed; }
.empty { padding: 26px; color: var(--muted); text-align: center; }
.load-more { margin: 0 12px 12px; height: 42px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 800; }
.modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,20,30,.48); z-index: 7000; padding: 16px; }
.modal.open { display: flex; }
.modal-card { width: min(420px, 100%); background: #fff; border-radius: 8px; padding: 16px; box-shadow: var(--shadow, 0 10px 28px rgba(22,35,49,.12)); }
.modal-card h3 { margin: 0 0 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 10px; }
.modal-actions button { flex: 1; height: 42px; border: 0; border-radius: 8px; font-weight: 800; }
.viewer { position: fixed; inset: 0; z-index: 7500; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.88); cursor: zoom-out; }
.viewer.open { display: flex; }
.viewer img { max-width: 94vw; max-height: 92vh; border-radius: 8px; }
.print-overlay { position: fixed; inset: 0; z-index: 7600; display: none; overflow: auto; scrollbar-gutter: stable both-edges; background: #fff; padding: 24px; }
.print-overlay.open { display: block; }
.print-card { width: min(100%, 760px); margin: 0 auto; }
.print-title { margin: 0 0 14px; text-align: center; }

.print-table td:nth-child(3), .print-table td:nth-child(4) { text-align: center; }
.print-img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; }

@media print { body > *:not(.print-overlay) { display: none !important; } .print-overlay { display: block !important; position: static !important; padding: 0 !important; } .no-print { display: none !important; } }
/* 2026 UI polish: quieter dashboard density, clearer actions, better mobile flow. */
:root {
  --bg: #edf2f5;
  --panel: #ffffff;
  --soft: #f6f8fa;
  --ink: #16212c;
  --muted: #667684;
  --line: #d9e3ea;
  --blue: #1665c1;
  --blue-soft: #eaf3ff;
  --green: #137a52;
  --green-soft: #e8f7ef;
  --amber: #a35d05;
  --red: #b42318;
  --shadow: 0 10px 24px rgba(22, 35, 49, .07);
  --shadow-sm: 0 4px 12px rgba(22, 35, 49, .06);
}
body {
  background: linear-gradient(180deg, #f8fbfd 0, var(--bg) 260px), var(--bg);
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; transition: background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
button:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid rgba(22, 101, 193, .22);
  outline-offset: 2px;
}
.desk { max-width: 1360px; padding: 20px; }
.top { margin-bottom: 16px; }
h1 { letter-spacing: .01em; }
.top small { color: #70808e; }
.top-actions { flex-wrap: wrap; justify-content: flex-end; }
.btn, .sync, .clear-pick, .add-pick, .finish, button.primary {
  white-space: nowrap;
  letter-spacing: 0;
}
.btn.primary, button.primary {
  border: 0;
  color: #fff;
  background: var(--blue);
  font-weight: 900;
}
.nav {
  width: fit-content;
  border: 1px solid #d5e0e8;
  background: #e7eef4;
}
.nav button { color: #4c6072; }
.nav .active { color: var(--blue); }
.hero-grid {
  grid-template-columns: minmax(320px, 1.25fr) repeat(3, minmax(160px, .55fr));
  gap: 12px;
}
.hero-card, .kpi, .panel, .record, .pick-row, .modal-card { border-radius: 8px; }
.hero-card {
  min-height: 158px;
  background:
    linear-gradient(90deg, rgba(16, 31, 45, .94), rgba(16, 31, 45, .42)),
    url("https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200&q=82") center/cover;
}
.hero-card h2 { font-size: 24px; }
.kpi { display: flex; flex-direction: column; justify-content: center; min-height: 112px; }
.kpi strong { line-height: 1; }
.panel { box-shadow: var(--shadow); }
.panel-head { min-height: 58px; }
.panel-head h2 { letter-spacing: .01em; }
.toolbar {
  grid-template-columns: minmax(220px, 1fr) minmax(128px, 150px) minmax(128px, 150px) minmax(128px, 150px) auto auto;
  gap: 10px;
}
input, select, textarea.field {
  border-color: #cbd8e2;
  color: var(--ink);
}
input::placeholder, textarea::placeholder { color: #8b99a6; }
.records { gap: 12px; }
.record {
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.record:hover {
  border-color: #c6d6e2;
  box-shadow: var(--shadow-sm);
  transform: translateY(-1px);
}
.record h3 { font-size: 16px; }
.meta { line-height: 1.45; }
.note { cursor: text; line-height: 1.35; }
.record-bottom {
  grid-template-columns: minmax(88px, 1fr) auto minmax(182px, auto);
  gap: 8px;
}
.stock-info .amount { font-size: 17px; }
.chip { justify-content: center; }
.chip.green { background: var(--green-soft); }
.chip.blue { background: var(--blue-soft); }
.sync { background: var(--blue-soft); }
.fuzzy-toggle.active, .sync:hover:not(:disabled) { background: var(--blue); color: #fff; }
.icon { font-size: 16px; line-height: 1; }
.add-pick { min-width: 56px; }
.pick-panel { top: 20px; }
.pick-list { max-height: calc(100vh - 274px); overflow: auto; }
.pick-group-head { background: #f3f8fc; }
.pick-row { grid-template-columns: 58px minmax(0, 1fr) 34px; }
.pick-line { flex-wrap: wrap; }
.total { position: relative; }
.total-line strong { font-size: 26px; }
.finish:disabled { background: #d5dee6; color: #7b8995; cursor: not-allowed; }
.empty { border: 1px dashed #cfdbe5; border-radius: 8px; background: #fbfdff; }
.load-more { display: block; width: calc(100% - 24px); }
.form-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 12px; }
.form-grid .field, .form-grid button { min-height: 42px; }
.preview { max-height: 320px; }
.toast { box-shadow: 0 14px 30px rgba(0,0,0,.18); }
.print-overlay { color: #17212b; }
@media (max-width: 1180px) {
  .hero-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar input { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .desk { padding: 14px; }
  .top { gap: 12px; }
  .top-actions { justify-content: stretch; }
  .top-actions .btn { flex: 1; }
  .nav { width: 100%; }
  .hero-grid { gap: 10px; }
  .hero-card { min-height: 136px; }
  .kpi { min-height: 96px; }
  .panel-head { align-items: flex-start; flex-direction: column; }
  .panel-head-actions { width: 100%; justify-content: space-between; }
  .toolbar { grid-template-columns: 1fr; }
  .record-top { grid-template-columns: 76px minmax(0, 1fr); }
  .record img { width: 76px; height: 76px; }
  .record-bottom { grid-template-columns: 1fr; align-items: stretch; }
  .mini-actions { grid-template-columns: minmax(62px, 1fr) minmax(64px, 1fr) 38px 38px !important; justify-content: stretch; }
  .qty-input, .add-pick, .mini-actions .icon { width: 100%; }
  .pick-list { max-height: none; }
  .pick-row { grid-template-columns: 52px minmax(0, 1fr) 34px; }
  .pick-row img { width: 52px; height: 52px; }
  .form-grid { grid-template-columns: 1fr; }
}

/* Desktop-only workstation mode: keep the operational layout intact. */
html, body { min-width: 1180px; }
@media (min-width: 1360px) {
  .desk { max-width: 1480px; }
  .records { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .work-grid { grid-template-columns: minmax(0, 1fr) 390px; }
